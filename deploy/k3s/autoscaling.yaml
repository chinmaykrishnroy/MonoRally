apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: monorally-gateway-hpa
  labels:
    app.kubernetes.io/name: monorally-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monorally-gateway
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: monorally-worker-hpa
  labels:
    app.kubernetes.io/name: monorally-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monorally-worker
  minReplicas: 4
  maxReplicas: 100
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: monorally-gateway-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: monorally-worker-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally-worker
