apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorally-matchmaker
  labels:
    app.kubernetes.io/name: monorally-matchmaker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally-matchmaker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally-matchmaker
    spec:
      containers:
        - name: matchmaker
          image: ghcr.io/chinmaykrishnroy/monorally:1.12.2
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          env:
            - name: SERVICE_ROLE
              value: "matchmaker"
            - name: BUS_TYPE
              value: "nats"
            - name: NATS_URL
              value: "nats://monorally-nats:4222"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: monorally-secrets
                  key: redis-url
