apiVersion: v1
kind: Service
metadata:
  name: monorally-nats
  labels:
    app.kubernetes.io/name: monorally-nats
spec:
  selector:
    app.kubernetes.io/name: monorally-nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
apiVersion: v1
kind: Service
metadata:
  name: monorally-nats-cluster
  labels:
    app.kubernetes.io/name: monorally-nats
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: monorally-nats
  ports:
    - name: cluster
      port: 6222
      targetPort: 6222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monorally-nats
  labels:
    app.kubernetes.io/name: monorally-nats
spec:
  serviceName: monorally-nats-cluster
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally-nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - "--cluster_name"
            - "monorally-nats-cluster"
            - "--cluster"
            - "nats://0.0.0.0:6222"
            - "--routes=nats://monorally-nats-0.monorally-nats-cluster.default.svc.cluster.local:6222,nats://monorally-nats-1.monorally-nats-cluster.default.svc.cluster.local:6222,nats://monorally-nats-2.monorally-nats-cluster.default.svc.cluster.local:6222"
          ports:
            - name: client
              containerPort: 4222
            - name: cluster
              containerPort: 6222
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /connz
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /varz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5
