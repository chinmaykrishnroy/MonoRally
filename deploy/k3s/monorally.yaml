apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorally
  labels:
    app.kubernetes.io/name: monorally
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally
    spec:
      containers:
        - name: monorally
          image: ghcr.io/chinmaykrishnroy/monorally:1.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            - name: DATA_BACKEND
              value: "postgres"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monorally-secrets
                  key: database-url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: monorally-secrets
                  key: redis-url
                  optional: true
            - name: CORS_ORIGINS
              value: "https://mono.prefect-sys.online"
            - name: HIT_PRESENTATION_DELAY_MS
              value: "90"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monorally
  labels:
    app.kubernetes.io/name: monorally
spec:
  selector:
    app.kubernetes.io/name: monorally
  ports:
    - name: http
      port: 80
      targetPort: http
