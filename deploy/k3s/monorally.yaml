apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorally
  labels:
    app.kubernetes.io/name: monorally
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally
    spec:
      containers:
        - name: monorally
          image: ghcr.io/chinmaykrishnroy/monorally:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            - name: CORS_ORIGINS
              value: "https://monorally.prefect-sys.online"
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monorally
  labels:
    app.kubernetes.io/name: monorally
spec:
  selector:
    app.kubernetes.io/name: monorally
  ports:
    - name: http
      port: 80
      targetPort: http
