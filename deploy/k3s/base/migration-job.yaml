apiVersion: batch/v1
kind: Job
metadata:
  name: monorally-db-migration
  labels:
    app.kubernetes.io/name: monorally-db-migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally-db-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrator
          image: ghcr.io/chinmaykrishnroy/monorally:1.13.0
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monorally-secrets
                  key: database-url
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
