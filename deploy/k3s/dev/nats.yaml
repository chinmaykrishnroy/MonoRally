apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorally-nats
  labels:
    app.kubernetes.io/name: monorally-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally-nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - "-m"
            - "8222"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /connz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /varz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: monorally-nats
  labels:
    app.kubernetes.io/name: monorally-nats
spec:
  selector:
    app.kubernetes.io/name: monorally-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
