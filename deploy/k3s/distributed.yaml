apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorally-nats
  labels:
    app.kubernetes.io/name: monorally-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally-nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          ports:
            - name: client
              containerPort: 4222
---
apiVersion: v1
kind: Service
metadata:
  name: monorally-nats
spec:
  selector:
    app.kubernetes.io/name: monorally-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorally-gateway
  labels:
    app.kubernetes.io/name: monorally-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/chinmaykrishnroy/monorally:1.12.1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            - name: SERVICE_ROLE
              value: "gateway"
            - name: BUS_TYPE
              value: "nats"
            - name: NATS_URL
              value: "nats://monorally-nats:4222"
            - name: DATA_BACKEND
              value: "postgres"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monorally-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: monorally-secrets
                  key: redis-url
            - name: CORS_ORIGINS
              value: "https://mono.prefect-sys.online"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorally-worker
  labels:
    app.kubernetes.io/name: monorally-worker
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: ghcr.io/chinmaykrishnroy/monorally:1.12.1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "node -e \"fetch('http://127.0.0.1:8787/drain', {method:'POST'}).catch(()=>{})\""]
          env:
            - name: SERVICE_ROLE
              value: "worker"
            - name: BUS_TYPE
              value: "nats"
            - name: NATS_URL
              value: "nats://monorally-nats:4222"
            - name: DATA_BACKEND
              value: "postgres"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monorally-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: monorally-secrets
                  key: redis-url
            - name: WORKER_CAPACITY_MAX_ROOMS
              value: "50"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorally-matchmaker
  labels:
    app.kubernetes.io/name: monorally-matchmaker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally-matchmaker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally-matchmaker
    spec:
      containers:
        - name: matchmaker
          image: ghcr.io/chinmaykrishnroy/monorally:1.12.1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          env:
            - name: SERVICE_ROLE
              value: "matchmaker"
            - name: BUS_TYPE
              value: "nats"
            - name: NATS_URL
              value: "nats://monorally-nats:4222"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: monorally-secrets
                  key: redis-url
---
apiVersion: v1
kind: Service
metadata:
  name: monorally
  labels:
    app.kubernetes.io/name: monorally
spec:
  selector:
    app.kubernetes.io/name: monorally-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
