apiVersion: apps/v1
kind: Deployment
metadata:
  name: monorally
  labels:
    app.kubernetes.io/name: monorally
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: monorally
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monorally
    spec:
      containers:
        - name: monorally
          image: ghcr.io/chinmaykrishnroy/monorally:1.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            - name: CORS_ORIGINS
              value: "https://mono.prefect-sys.online"
            - name: LEADERBOARD_FILE
              value: "/data/leaderboard.json"
          volumeMounts:
            - name: monorally-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: monorally-data
          persistentVolumeClaim:
            claimName: monorally-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monorally-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: monorally
  labels:
    app.kubernetes.io/name: monorally
spec:
  selector:
    app.kubernetes.io/name: monorally
  ports:
    - name: http
      port: 80
      targetPort: http
