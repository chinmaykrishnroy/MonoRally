services:
  postgres:
    image: postgres:16-alpine
    container_name: monorally-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monorally
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monorally"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monorally-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: monorally-nats
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-14222}:4222"

  monorally:
    build:
      context: .
      args:
        VERSION: "${APP_VERSION:-dev}"
    image: monorally:local
    container_name: monorally
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/monorally}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      NATS_URL: "${NATS_URL:-nats://nats:4222}"
      DATA_BACKEND: "${DATA_BACKEND:-postgres}"
      BUS_TYPE: "${BUS_TYPE:-nats}"
      SERVICE_ROLE: "${SERVICE_ROLE:-unified}"
    ports:
      - "${APP_HOST_PORT:-18787}:${PORT:-8787}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 8787) + '/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
